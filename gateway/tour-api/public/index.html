<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Private Chat Room</title>
    <style>
        body {
            font-family: Arial;
            max-width: 600px;
            margin: 20px auto;
        }

        #messages {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            margin-bottom: 10px;
        }

        #messages li {
            padding: 5px 10px;
        }

        #messages li.user {
            background: #daf1da;
            text-align: right;
        }

        #messages li.admin {
            background: #f1dadf;
            text-align: left;
        }

        form {
            display: flex;
        }

        input {
            flex: 1;
            padding: 10px;
            font-size: 16px;
        }

        button {
            padding: 10px;
            font-size: 16px;
        }
    </style>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>

<body>
    <h2>Private Chat (User/Admin)</h2>

    <label>
        Your role:
        <select id="role">
            <option value="user">User</option>
            <option value="admin">Admin</option>
        </select>
    </label>

    <label>
        Room ID:
        <input type="text" id="roomId" value="room1" />
    </label>

    <button id="joinBtn">Join Room</button>

    <ul id="messages"></ul>

    <form id="chat-form" style="display:none;">
        <input id="message-input" autocomplete="off" placeholder="Type your message..." />
        <button type="submit">Send</button>
    </form>

    <script>
        const socket = io('http://localhost:5000');

        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const messages = document.getElementById('messages');
        const joinBtn = document.getElementById('joinBtn');
        const roleSelect = document.getElementById('role');
        const roomInput = document.getElementById('roomId');

        let currentRoom = null;
        let currentRole = 'user';

        joinBtn.addEventListener('click', () => {
            currentRoom = roomInput.value.trim();
            currentRole = roleSelect.value;
            if (!currentRoom) {
                alert('Please enter a room ID');
                return;
            }
            socket.emit('joinRoom', currentRoom);
            messages.innerHTML = '';
            form.style.display = 'flex';
            joinBtn.disabled = true;
            roomInput.disabled = true;
            roleSelect.disabled = true;
            addMessage(`Joined room: ${currentRoom}`, 'system');
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            const msg = input.value.trim();
            if (!msg) return;
            socket.emit('chat message', { roomId: currentRoom, sender: currentRole, message: msg });
            addMessage(msg, currentRole);
            input.value = '';
        });

        socket.on('chat message', ({ sender, message }) => {
            // Jangan tampilkan pesan sendiri dua kali
            if (sender === currentRole) return;
            addMessage(message, sender);
        });

        socket.on('chat history', (messages) => {
            messages.forEach(({ sender, message }) => {
                addMessage(message, sender);
            });
        });

        function addMessage(text, sender) {
            const li = document.createElement('li');
            const now = new Date().toLocaleTimeString(); // contoh timestamp
            li.textContent = `[${now}] ${text}`;
            li.classList.add(sender);
            if (sender === 'system') {
                li.style.textAlign = 'center';
                li.style.fontStyle = 'italic';
                li.style.color = '#888';
            }
            messages.appendChild(li);
            messages.scrollTop = messages.scrollHeight;
        }

    </script>
</body>

</html>
