version: "3.9"

services:
  postgres:
    container_name: postgres-db
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Serverh5n&*#
      POSTGRES_DB: tourdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    container_name: redis-server
    image: redis:7-alpine
    command: redis-server --requirepass Serverh5n
    ports:
      - "6379:6379"
    restart: unless-stopped

networks:
  default:
    name: shared-network   # 👈 PENTING

volumes:
  postgres_data:
